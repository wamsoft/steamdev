[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steamdev"
version = "0.1.0"
description = "Headless control library / CLI for SteamOS devkit devices (Steam Deck)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
# mDNS 探索 (steamdev discover / 名前指定)。IP 直指定運用なら不要
discovery = ["zeroconf>=0.130"]

[project.scripts]
steamdev = "steamdev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
