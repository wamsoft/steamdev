[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steamctl-deck"
version = "0.1.0"
description = "Headless control library / CLI for SteamOS devkit devices (Steam Deck)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "paramiko>=3.0",
    "zeroconf>=0.130",
]

[project.scripts]
steamctl = "steamctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
